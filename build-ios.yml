name: Build Intera Music IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS archive
        run: |
          xcodebuild archive \
            -project InteraMusicPlayer.xcodeproj \
            -scheme InteraMusicPlayer \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$PWD/build/InteraMusicPlayer.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/InteraMusicPlayer.xcarchive/Products/Applications/InteraMusic.app build/Payload/
          cd build
          /usr/bin/zip -r InteraMusicPlayer-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: InteraMusicPlayer-IPA
          path: build/InteraMusicPlayer-unsigned.ipa
          if-no-files-found: error
